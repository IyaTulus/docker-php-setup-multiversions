services:
  php56:
    build:
      context: .
      dockerfile: php/56/Dockerfile
    container_name: php56
    restart: unless-stopped
    ports:
      - "8056:80"
    volumes:
      - ./projects:/var/www/html
      - ./php/56/index.php:/var/www/html/index.php:ro
      - ./php/56/php.ini:/usr/local/etc/php/php.ini:ro

  php74:
